<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Programming Assessment</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="hero-section">
    <div style="max-width: 400px; margin: 100px auto; padding: 40px;" class="glass-card">
        <h2 style="text-align: center; margin-bottom: 30px; font-weight: 800; letter-spacing: 1px;">Admin Entry</h2>
        
        <form action="/admin/login" method="POST">
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Administrative User</label>
                <input type="text" name="username" style="width: 100%; padding: 12px; background: rgba(15,23,42,0.5); border: 1px solid var(--card-border); border-radius: 8px; color: white; box-sizing: border-box;" required>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem;">Secure Password</label>
                <input type="password" name="password" style="width: 100%; padding: 12px; background: rgba(15,23,42,0.5); border: 1px solid var(--card-border); border-radius: 8px; color: white; box-sizing: border-box;" required>
            </div>

            {% if error %}
            <p style="color: #f43f5e; font-size: 0.85rem; text-align: center; margin-bottom: 20px;">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn-primary" style="width: 100%;">Verify & Enter Dashboard</button>
            <p style="text-align: center; margin-top: 20px;">
                <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">Return to Main Portal</a>
            </p>
        </form>
    </div>
</body>
</html>
